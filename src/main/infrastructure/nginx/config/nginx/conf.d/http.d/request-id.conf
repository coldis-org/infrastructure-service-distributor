
# Request id, sent upstream, returned to the client and logged. A service in the local network calling
# another through the distributor already carries one: it is kept, so the whole call chain shares one
# id. Any other caller gets a new one ($request_uuid4, session-cookies.conf): an id from outside is
# not trusted, and only a well-formed UUID is kept, so the header cannot write arbitrary text to logs.
map "$network:$http_x_request_id"				$request_trace_id {
    "~^localnet:(?<trusted_request_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$"	$trusted_request_id;
    default										$request_uuid4;
}

# Session and durable session of the log service (@supersim/log and LogEnhancerHttpFilter cookies), so
# an access log line can be matched to the log service's session. Only the first 8 characters are
# logged: enough to find the session in a time window, not enough to replay it.
map $http_cookie								$log_session {
    "~*(?:^|; *)x-supersim-request-session-id=(?<log_session_prefix>[0-9a-f]{8})"	$log_session_prefix;
    default										"-";
}
map $http_cookie								$log_durable_session {
    "~*(?:^|; *)x-supersim-request-durable-session-id=(?<log_durable_session_prefix>[0-9a-f]{8})"	$log_durable_session_prefix;
    default										"-";
}
