
proxy_no_cache      $no_cache;
proxy_cache_bypass  $no_cache;

proxy_hide_header   Cache-Control;
proxy_hide_header   X-Request-ID;
add_header          Cache-Control $nocache_value always;

# Declares add_header, so repeats the request id response header. Do not include it at the same level as
# user-agent-headers.conf, which also does: the header would be sent twice.
include             conf.d/include.d/request-id-response.conf;
