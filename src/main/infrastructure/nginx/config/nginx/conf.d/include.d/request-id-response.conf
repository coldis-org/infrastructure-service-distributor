
# Request id returned to the client (http.d/request-id.conf). A level that declares any add_header drops
# the inherited ones, and one that declares any proxy_hide_header drops those: every include that
# declares either includes this file, and so must a server or location with its own add_header.
proxy_hide_header   X-Request-ID;
add_header          X-Request-ID $request_trace_id always;
