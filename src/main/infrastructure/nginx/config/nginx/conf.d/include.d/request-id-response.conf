
# Request id returned to the client (http.d/request-id.conf). A level that declares any add_header drops
# the inherited ones: every include that declares add_header includes this file, and so must a server or
# location with its own add_header. Include it once per level: nginx sends a header declared twice twice.
# The upstream's own X-Request-ID is hidden by proxy_hide_header, kept out of this file because a level
# declaring proxy_hide_header drops the inherited ones (proxy.conf and no-cache-on-cookies.conf hide it).
add_header          X-Request-ID $request_trace_id always;
