
# Include in the virtual host's own server{} (if/return is not valid at http
# level), before its server-level rewrite, break or return. Checks the path as the
# client sent it: not paths made by the virtual host's rewrites or by a proxy_pass
# that maps a prefix onto the backend root.

# Denies internal paths, in any letter case.
if ($uri ~* "^/(properties|install/data|batch)") {
	return 403;
}
# Denies path parameters on inner segments (some backends strip them before routing).
if ($uri ~ ";[^/]*/") {
	return 403;
}
