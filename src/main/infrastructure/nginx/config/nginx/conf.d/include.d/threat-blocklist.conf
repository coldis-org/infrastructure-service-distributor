# Answers 403 to sources in the threat blocklist ($threat_blocked, from
# http.d/threat-blocklist-geo.conf, filled by nginx_update_threat_blocklist).
# Included by the default servers only, so it covers requests for hostnames no
# virtual host claims. A virtual host that wants the block includes this file
# in its own server{} — if/return is not valid at http level.
if ($threat_blocked) {
    return 403;
}
